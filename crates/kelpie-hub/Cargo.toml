[package]
name = "kelpie-hub"
description = "The kelpie hub: a mailbox that relays end-to-end encrypted boards between machines and devices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = "=0.11.1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "=0.23.1"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive"] }
futures-util = { version = "=0.3.34", default-features = false }
getrandom = "=0.4.3"
hkdf = "=0.13.0"
hmac = "=0.13.0"
http-body = "=1.1.0"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
kelpie-hub-api = { path = "../kelpie-hub-api" }
kelpie-hub-protocol = { path = "../kelpie-hub-protocol" }
openssl = { version = "=0.10.81", features = ["vendored"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdh", "ecdsa", "std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "fallible_uint"] }
rustls-platform-verifier = "=0.7.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tower-service = "=0.3.3"
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
kelpie-hub-fakes = { path = "../kelpie-hub-fakes" }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query"] }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["io-util"] }
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
webauthn-rs-proto = "=0.5.5"
