[package]
name = "kelpie-hub-fakes"
description = "A fake machine and a fake phone that drive the kelpie hub end to end"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fake-machine"
path = "src/bin/fake-machine.rs"

[[bin]]
name = "fake-phone"
path = "src/bin/fake-phone.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
kelpie-hub-api = { path = "../kelpie-hub-api" }
kelpie-hub-protocol = { path = "../kelpie-hub-protocol" }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "macros", "time", "io-std", "io-util"] }
