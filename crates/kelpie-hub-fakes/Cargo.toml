[package]
name = "kelpie-hub-fakes"
description = "A fake machine and a fake phone that drive the kelpie hub end to end"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fake-machine"
path = "src/bin/fake-machine.rs"

[[bin]]
name = "fake-phone"
path = "src/bin/fake-phone.rs"

[dependencies]
aes-gcm = "=0.11.1"
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
kelpie-hub-api = { path = "../kelpie-hub-api" }
getrandom = "=0.4.3"
hkdf = "=0.13.0"
kelpie-hub-protocol = { path = "../kelpie-hub-protocol" }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdh", "ecdsa", "std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["rt", "macros", "time", "io-std", "io-util"] }
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
webauthn-rs-proto = "=0.5.5"
